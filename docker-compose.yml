services:
  tests:
    build: .
    ipc: host
    volumes:
      - ./reports:/app/reports
    depends_on:
      - allure

  allure:
    image: frankescobar/allure-docker-service:latest
    ports:
      - "5050:5050"
    environment:
      CHECK_RESULTS_EVERY_SECONDS: 5
      KEEP_HISTORY: "1"
    volumes:
      - ./reports/allure-results:/app/allure-results